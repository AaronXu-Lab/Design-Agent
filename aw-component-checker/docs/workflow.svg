<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 925" role="img" aria-labelledby="title desc">
<title id="title">旧组件入口 · 迁移与转发</title><desc id="desc">旧 aw-component-checker 只保留迁移方法。旧编辑请求说明规范维护源；指导和审查定位新入口并实际执行，缺失时报告依赖，不保留静态组件规则或知识兜底。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52606d"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;text-anchor:middle;fill:#243746}.title{font-size:30px;font-weight:700}.label{font-size:18px;font-weight:600}.note{font-size:14px;font-weight:400}.edge,.join{fill:none;stroke:#52606d;stroke-width:2.5}.edge{marker-end:url(#arrow)}</style>
<rect width="1200" height="925" fill="#f7f9fb"/>
<text class="title" x="600" y="48">旧组件入口 · 迁移与转发</text>
<rect x="380" y="90" width="440" height="76" rx="14" fill="#ffffff" stroke="#9eacb8" stroke-width="2"/>
<text class="label" x="600.0" y="120">接收旧组件入口请求</text>
<text class="note" x="600.0" y="145">保留原范围与已有授权</text>
<path class="edge" d="M600 166V205"/>
<path d="M600 205L775 255L600 305L425 255Z" fill="#fff7e6" stroke="#c98312" stroke-width="2"/>
<text class="label" x="600" y="261">旧 Reference 编辑请求？</text>
<path class="edge" d="M425 255H300V340"/>
<text class="note" x="345" y="239">是</text>
<rect x="70" y="340" width="460" height="76" rx="14" fill="#edf9f1" stroke="#2e8b54" stroke-width="2"/>
<text class="label" x="300.0" y="370">说明 AaronUI-Web 规范源位置</text>
<text class="note" x="300.0" y="395">源仓修改沿用具体授权，不在此重建规则</text>
<path class="edge" d="M600 305V460"/>
<text class="note" x="760" y="371">否：指导 / 审查</text>
<path d="M600 460L775 510L600 560L425 510Z" fill="#fff7e6" stroke="#c98312" stroke-width="2"/>
<text class="label" x="600" y="516">新入口可用？</text>
<path class="edge" d="M775 510H880"/>
<text class="note" x="825" y="494">否</text>
<rect x="880" y="473" width="280" height="76" rx="14" fill="#fff0ef" stroke="#c94b43" stroke-width="2"/>
<text class="label" x="1020.0" y="503">报告缺失并停止相关执行</text>
<text class="note" x="1020.0" y="528">不自动安装，不回退旧规范</text>
<path class="edge" d="M600 560V620"/>
<text class="note" x="625" y="600">是</text>
<rect x="380" y="620" width="440" height="76" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/>
<text class="label" x="600.0" y="650">读取并执行 aw-component-advisor</text>
<text class="note" x="600.0" y="675">实现前 guidance · 已有用法 audit</text>
<path class="edge" d="M600 696V745"/>
<rect x="380" y="745" width="440" height="76" rx="14" fill="#edf9f1" stroke="#2e8b54" stroke-width="2"/>
<text class="label" x="600.0" y="775">按新入口交付实际结果</text>
<text class="note" x="600.0" y="800">未覆盖 / 待验证不能算通过</text>
<text class="note" x="600" y="873">弃用兼容入口 · 本包不含组件规范或索引</text>
</svg>
