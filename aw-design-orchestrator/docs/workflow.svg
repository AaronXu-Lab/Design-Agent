<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1570" role="img" aria-labelledby="title desc">
<title id="title">AW Design Orchestrator · 设计流程入口</title><desc id="desc">帮助单独展示并结束；正常流程塑形、组件 guidance、当前执行者用 AaronUI-Web 真实组件生成初版、信息审计、同源组件 audit、流程完整性。保留人工 Review、获准修复与局部复核、独立任务走查和最终文案收敛。用户明确要求优先，Example 规则与结构优先于 AI 提案；回校简报，交接来源与差异；知识缺口不得算通过。</desc>
