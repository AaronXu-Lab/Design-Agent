<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1650" role="img" aria-labelledby="title desc">
<title id="title">组件指导与审查 · 当前目录与参考</title><desc id="desc">从当前知识源读完整分页 Example 目录，选择候选后读实现；无明显候选则分批读完任务组件范围全部实现，记录已读未读。可参考与可移植分开。guidance 回校简报并标清来源与差异；用户明确要求优先，默认沿用匹配 Example 的明确规则与结构，AI 提案只补空白；source-reference 仅表示适配依赖。audit 对照原 Example 实际渲染并说明必要差异，无法对照则待验证；缺口如实交付，获准改动完成验证。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52606d"/></marker></defs>
