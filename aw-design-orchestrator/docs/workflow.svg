<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1570" role="img" aria-labelledby="title desc">
<title id="title">AW Design Orchestrator · 设计流程入口</title><desc id="desc">帮助单独展示并结束；正常流程依次执行塑形、组件指导、当前执行者生成初版、信息与组件审查、流程补全、独立任务走查及文案收敛。编排层负责阶段、交接、人工 Review 与续接状态，专项方法和证据要求由对应 Skill 维护。获准改动后局部复查，缺失证据如实交付。</desc>
